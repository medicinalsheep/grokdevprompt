<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrokDevPrompt v0.5</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a192f;
            color: #ccd6f6;
            margin: 0;
            padding: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 1000px;
            margin: auto;
            background: #112240;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
        }
        h1 { text-align: center; color: #64ffda; margin-bottom: 10px; }
        h2 { color: #ffffff; border-bottom: 2px solid #233554; padding-bottom: 10px; margin-top: 40px; }
        label { display: block; margin-top: 20px; font-weight: bold; color: #ffffff; }
        input, textarea, select {
            width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #334d6e;
            border-radius: 8px; background: #233554; color: #ccd6f6;
        }
        textarea { height: 120px; resize: vertical; }
        button {
            margin-top: 30px; padding: 14px 28px; background: #64ffda; color: #0a192f;
            border: none; border-radius: 8px; font-size: 18px; cursor: pointer; width: 100%;
        }
        button:hover { background: #52d6b8; }
        #output {
            margin-top: 40px; padding: 20px; background: #233554; border: 1px solid #64ffda;
            border-radius: 8px; white-space: pre-wrap; font-family: monospace; display: none;
        }
        #copyBtn { margin-top: 15px; display: none; width: auto; }
        .checkbox-group {
            display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-top: 15px;
        }
        .checkbox-group label {
            display: flex; align-items: center; font-weight: normal; color: #ccd6f6; cursor: pointer;
        }
        .tooltip {
            position: relative; display: inline-block; margin-left: 6px; color: #64ffda; cursor: help;
        }
        .tooltip .tooltiptext {
            visibility: hidden; width: 260px; background: #233554; color: #ccd6f6;
            border-radius: 8px; padding: 10px; position: absolute; z-index: 1; bottom: 125%; left: 50%;
            margin-left: -130px; opacity: 0; transition: opacity 0.3s;
        }
        .tooltip:hover .tooltiptext { visibility: visible; opacity: 1; }
        .warning { color: #ffcc00; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h1>GrokDevPrompt v0.5</h1>
        <p style="text-align:center; font-size:1.1em;">Dynamic, spec-driven prompt architect for Grok. Now with deep self-improvement capabilities.</p>

        <h2>Step 1: Project Basics</h2>
        <label for="projectType">Project Type</label>
        <select id="projectType">
            <option value="web app">Web Application</option>
            <option value="mobile app">Mobile App</option>
            <option value="game">Game (2D/3D)</option>
            <option value="three.js tool">Three.js 3D Tool/Game</option>
            <option value="unity game">Unity Game</option>
            <option value="unreal engine project">Unreal Engine Project</option>
            <option value="vr/ar app">VR/AR App</option>
            <option value="ai/ml tool">AI/ML Tool</option>
            <option value="blockchain app">Blockchain / dApp</option>
            <option value="game mod">Game Mod</option>
            <option value="steam integrated app">Steam Integrated App</option>
            <option value="desktop tool">Desktop Tool</option>
            <option value="cli tool">CLI Tool</option>
            <option value="other">Other</option>
        </select>

        <label for="title">Project Title</label>
        <input type="text" id="title" placeholder="e.g., Nebula Explorer">

        <label for="description">High-Level Description</label>
        <textarea id="description" placeholder="Describe what you want to build..."></textarea>

        <h2>Step 2: Features</h2>
        <div class="checkbox-group" id="commonFeatures">
    <label><input type="checkbox" value="User login and registration"> User login and registration</label>
    <label><input type="checkbox" value="Responsive design for mobile and desktop"> Responsive design (mobile & desktop)</label>
    <label><input type="checkbox" value="Dark mode toggle"> Dark mode toggle</label>
    <label><input type="checkbox" value="Score tracking or progress saving"> Score tracking / progress saving</label>
    <label><input type="checkbox" value="Sound effects and music"> Sound effects and music</label>
    <label><input type="checkbox" value="Multiplayer support"> Multiplayer support</label>
    <label><input type="checkbox" value="Data storage (local or database)"> Data storage</label>
    <label><input type="checkbox" value="Animations and transitions"> Animations and smooth transitions</label>
    <label><input type="checkbox" value="Search functionality"> Search functionality</label>
    <label><input type="checkbox" value="Notifications or alerts"> Notifications / alerts</label>
    <label><input type="checkbox" value="Sharing options"> Sharing options</label>
    <label><input type="checkbox" value="Accessibility features"> Accessibility features</label>
    <label><input type="checkbox" value="High-resolution graphics support (4K, retina)"> High-resolution graphics (4K/retina)</label>
    <label><input type="checkbox" value="Cross-platform compatibility"> Cross-platform compatibility</label>
    <label><input type="checkbox" value="AI integration"> AI integration</label>
    <label><input type="checkbox" value="VR/AR support"> VR/AR support</label>
    <label><input type="checkbox" value="Monetization (in-app purchases, ads)"> Monetization features</label>
    <label><input type="checkbox" value="Analytics and tracking"> Analytics & tracking</label>
    <label><input type="checkbox" value="Cloud syncing"> Cloud syncing</label>
    <label><input type="checkbox" value="Procedural generation"> Procedural generation</label>
    <label><input type="checkbox" value="Modding support"> Modding support</label>
    <label><input type="checkbox" value="Steamworks integration"> Steamworks integration</label>
    <label><input type="checkbox" value="Physics engine"> Physics engine</label>
    <label><input type="checkbox" value="Internationalization (i18n)"> Internationalization (i18n)</label>
    <label><input type="checkbox" value="Offline support / PWA"> Offline support (PWA)</label>
    <label><input type="checkbox" value="Security features"> Security features</label>
    <label><input type="checkbox" value="Performance optimization"> Performance optimization</label>
</div>

        <label for="customFeatures">Custom Features (one per line)</label>
        <textarea id="customFeatures" placeholder="Feature 1&#10;Feature 2"></textarea>

        <h2>Step 3: Grok Capabilities & Tech</h2>
        <label for="techStack">Tech Stack / Libraries</label>
        <input type="text" id="techStack" placeholder="HTML, CSS, JS, Three.js, etc.">

        <label for="requirements">Non-Functional Requirements</label>
        <textarea id="requirements" placeholder="Performance, accessibility, etc."></textarea>

        <label for="additional">Additional Instructions / Constraints</label>
        <textarea id="additional" placeholder="Any extra rules..."></textarea>

            <!-- Desired Visual Theme Field -->
        <label for="finalTheme">Desired visual theme / style / color scheme for the final product 
            <span class="tooltip">?<span class="tooltiptext">Examples: neon cyberpunk, clean minimalist light, retro 8-bit, corporate blue, high-contrast. Leave empty for sensible defaults.</span></span>
        </label>
        <textarea id="finalTheme" placeholder="Leave empty for sensible defaults"></textarea>

        <h2>Experimental Features</h2>
        <p class="warning">Warning: You might go down the rabbit hole 🌀</p>
        <div class="checkbox-group">
            <label><input type="checkbox" id="truncateCheckbox"> Truncate or multiple response</label>
            <label><input type="checkbox" id="selfImproveCheckbox"> Prompt self-improvement loop 
                <span class="tooltip">?<span class="tooltiptext">Generates an improved version of this tool, more tailored to your project. Retains the loop until unchecked.</span></span>
            </label>
        </div>

        <button onclick="generatePrompt()">Generate Grok Prompt</button>

        <div id="output"></div>
        <button id="copyBtn" onclick="copyPrompt()">Copy to Clipboard</button>
    </div>

<script>
    function generatePrompt() {
        // Collect all inputs
        const type = document.getElementById('projectType').value;
        const title = document.getElementById('title').value.trim() || 'My Project';
        const desc = document.getElementById('description').value.trim() || 'A complete, production-ready project based on the specifications below.';
        
        const commonCheckboxes = document.querySelectorAll('#commonFeatures input[type="checkbox"]:checked');
        const commonFeaturesList = Array.from(commonCheckboxes).map(cb => cb.value);
        
        const customFeatures = document.getElementById('customFeatures').value.trim().split('\n').filter(f => f.trim());
        
        const tech = document.getElementById('techStack').value.trim();
        const reqs = document.getElementById('requirements').value.trim();
        const add = document.getElementById('additional').value.trim();
        const finalTheme = document.getElementById('finalTheme').value.trim();

        const isTruncate = document.getElementById('truncateCheckbox').checked;
        const isSelfImprove = document.getElementById('selfImproveCheckbox').checked;

        let prompt = '';

        if (isSelfImprove) {
            const featuresStatus = commonFeaturesList.length > 0 ? commonFeaturesList.join(', ') : 'not yet specified';
            const customStatus = customFeatures.length > 0 ? customFeatures.join(', ') : 'not yet specified';

            prompt = `You are an expert prompt engineer and full-stack developer specializing in building highly effective, spec-driven prompt generator tools for Grok.

Create an **improved version** of the tool at https://medicinalsheep.github.io/grokdevprompt/. 
This is **self-improvement loop iteration #1** (increment the number in future generations).

Current project context:
- Project Type: ${type}
- Title: ${title}
- Description: ${desc}
- Common Features: ${featuresStatus}
- Custom Features: ${customStatus}
- Tech Stack: ${tech || 'not yet specified'}
- Non-functional Requirements: ${reqs || 'not yet specified'}
- Additional Instructions: ${add || 'not yet specified'}

### Required Improvements:
1. Add project-specific feature checkboxes with benefit + side-effect tooltips.
2. Add a Recommendations / Guidance section with contextual advice.
3. Keep the "Desired visual theme" field visible by default.
4. Keep the self-improvement checkbox pre-checked by default.
5. Maintain clean support for the truncate option.
6. Preserve the original spec-driven development best practices.

Output the **complete single-file HTML** (CSS + JS embedded) ready to use. Do not truncate.`;
        } else {
            let responseStyle = isTruncate 
                ? `You may deliver the response in multiple parts if the project is very large. Always provide complete, ready-to-use code blocks for each major section (HTML, CSS, full JS, etc.).`
                : `Provide complete, working code in a single response when possible. Do not truncate.`;

            prompt = `You are an expert full-stack developer and game/engine programmer, specializing in complete, production-ready projects.

Develop a complete, standalone ${type} titled "${title}".

High-level description: ${desc}

Key features:
${[...commonFeaturesList, ...customFeatures].join('\n') || '(None specified)'}

Tech stack and libraries to use: ${tech || 'Pure HTML/CSS/JS (or appropriate for the project type)'}

Non-functional requirements:
${reqs || '(None specified)'}

Additional instructions:
${add || '(None specified)'}

Desired final product visual style/theme: ${finalTheme || 'Modern, clean, and polished (appropriate for the project type)'}

Follow spec-driven development best practices:
First, create a detailed Development Plan: break down into modules/components, architecture overview, file structure.
Then, provide a step-by-step Implementation Checklist with testable tasks.
${responseStyle}
Include all necessary HTML, CSS, JavaScript (and other files if needed).
Make it responsive, performant, and polished.
Add comments explaining key parts.
At the end, provide clear instructions on how to run/test it.
If it's a game or interactive tool, ensure it's engaging and bug-free.

Output the full implementation in fenced code blocks, ready to copy and run.`;
        }

        const outputEl = document.getElementById('output');
        outputEl.textContent = prompt;
        outputEl.style.display = 'block';
        document.getElementById('copyBtn').style.display = 'block';
    }

    function copyPrompt() {
        const outputEl = document.getElementById('output');
        navigator.clipboard.writeText(outputEl.textContent).then(() => {
            alert('Prompt copied to clipboard!');
        });
    }
</script>
</body>
</html>
