<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GrokDevPrompt v0.4.2</title>
    <link rel="icon" type="image/png" href="icons/favicon-32.png">
    <link rel="apple-touch-icon" href="icons/icon-192.png">
    <style>
        :root {
            --primary: #64ffda;
            --bg: #0a192f;
            --card: #112240;
            --text: #ccd6f6;
            --accent: #233554;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 16px;
            line-height: 1.6;
            font-size: clamp(14px, 3.5vw, 16px);
        }
        .container {
            max-width: 1000px;
            margin: 0 auto;
            background: var(--card);
            padding: clamp(20px, 5vw, 40px);
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.6);
            box-sizing: border-box;
        }
        h1 { text-align: center; color: var(--primary); margin: 0 0 8px 0; font-size: clamp(1.8rem, 8vw, 2.8rem); }
        .intro-p { text-align: center; color: #8892b0; margin-bottom: 2rem; font-size: clamp(0.95rem, 4vw, 1.1rem); }
        h2 {
            color: #ffffff;
            border-bottom: 2px solid #233554;
            padding-bottom: 10px;
            margin: 2.5rem 0 1.25rem;
            font-size: clamp(1.4rem, 6vw, 1.9rem);
        }
        label { display: block; margin-top: 1.5rem; font-weight: bold; color: #ffffff; font-size: 1.05em; }
        input, textarea, select {
            width: 100%;
            padding: clamp(10px, 3vw, 14px);
            margin-top: 6px;
            border: 1px solid #334d6e;
            border-radius: 8px;
            box-sizing: border-box;
            background: var(--accent);
            color: var(--text);
        }
        input:focus, textarea:focus, select:focus { border-color: var(--primary); outline: none; }
        textarea { height: 120px; resize: vertical; }
        button {
            margin-top: 2rem;
            padding: clamp(14px, 4vw, 18px) 28px;
            background: var(--primary);
            color: #0a192f;
            border: none;
            border-radius: 8px;
            font-size: clamp(1.1rem, 5vw, 1.25rem);
            font-weight: bold;
            cursor: pointer;
            width: 100%;
        }
        button:hover { background: #52d6b8; transform: translateY(-3px); box-shadow: 0 10px 20px rgba(100, 255, 218, 0.3); }
        #output {
            margin-top: 2rem;
            padding: 20px;
            background: var(--accent);
            border: 1px solid var(--primary);
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            color: var(--text);
            display: none;
            overflow-x: auto;
            max-height: 55vh;
            overflow-y: auto;
        }
        #copyBtn { margin-top: 12px; padding: 12px 24px; background: var(--primary); color: #0a192f; width: auto; display: none; font-weight: bold; }
        .checkbox-group {
            margin-top: 1rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(min(260px, 100%), 1fr));
            gap: 12px;
        }
        .checkbox-group label {
            display: flex;
            align-items: flex-start;
            margin: 0;
            font-weight: normal;
            color: var(--text);
            cursor: pointer;
        }
        .checkbox-group input { margin-right: 10px; margin-top: 3px; accent-color: var(--primary); }
        .warning { color: #ffcc00; font-weight: bold; }
        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.85em;
            color: #8892b0;
            padding-top: 2rem;
            border-top: 1px solid #233554;
        }
        footer a { color: var(--primary); text-decoration: none; }
        footer a:hover { color: #52d6b8; }
    </style>
</head>

            <option value="automation">Automation / Workflow</option>
            <option value="other">Other</option>
        </select>
